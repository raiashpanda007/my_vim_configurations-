
##### BASIC BEHAVIOR #####
set -g mouse on
set -g history-limit 10000
set -g escape-time 0
setw -g mode-keys vi
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

##### STATUS BAR (Rose Pine — Prime style) #####
set -g status on
set -g status-position bottom
set -g status-interval 1

# Rose Pine colors
rose_pine_base="#191724"
rose_pine_surface="#1f1d2e"
rose_pine_muted="#6e6a86"
rose_pine_subtle="#908caa"
rose_pine_text="#e0def4"
rose_pine_rose="#ebbcba"
rose_pine_pine="#31748f"
rose_pine_foam="#9ccfd8"
rose_pine_iris="#c4a7e7"

set -g status-style "bg=#191724,fg=#908caa"

# Left: session name with icon
set -g status-left-length 40
set -g status-left "#[fg=#ebbcba,bold]  #S #[fg=#6e6a86] │ "

# Right: date and time with icons
set -g status-right-length 60
set -g status-right "#[fg=#6e6a86] │ #[fg=#e0def4] %-d %b #[fg=#6e6a86]│ #[fg=#ebbcba,bold] %H:%M "

# Window tabs: inactive
set -g window-status-format         "#[fg=#6e6a86] #I  #W "
# Window tabs: active — highlight with pine blue
set -g window-status-current-format "#[fg=#31748f,bold] #I  #W "

# Separator between window tabs
set -g window-status-separator ""

# Pane borders (subtle, rose pine style)
set -g pane-border-style "fg=#26233a"
set -g pane-active-border-style "fg=#31748f"

# Message / command line
set -g message-style "bg=#1f1d2e,fg=#e0def4"

# Mode (copy mode) highlight
set -g mode-style "bg=#403d52,fg=#e0def4"

##### TPM #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

##### KEEP DEFAULT PREFIX (Ctrl+b) #####

##### PANE MOVEMENT WITH ARROW KEYS #####
bind Left  select-pane -L
bind Right select-pane -R
bind Up    select-pane -U
bind Down  select-pane -D

##### OPTIONAL: ALSO SUPPORT HJKL #####
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### SPLITS (EASY TO REMEMBER) #####
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

##### WINDOW MANAGEMENT #####
bind c new-window
bind , command-prompt -I "#W" "rename-window '%%'"

##### DIRECT WINDOW SWITCHING (NO PREFIX) #####
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

##### WINDOW NAVIGATION #####
bind n next-window
bind p previous-window

##### PANE RESIZE (PREFIX + ARROWS) #####
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up    resize-pane -U 3
bind -r Down  resize-pane -D 3

##### QUALITY OF LIFE #####
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"
run '~/.tmux/plugins/tpm/tpm'
