
##### BASIC BEHAVIOR #####
set -g mouse on
set -g history-limit 10000
set -g escape-time 0
setw -g mode-keys vi

##### STATUS BAR (IMPORTANT FOR ALACRITTY) #####
set -g status on
set -g status-position bottom
set -g status-style bg=black,fg=white
set -g status-left-length 40
set -g status-right-length 100
set -g status-left "#[fg=green]#S "
set -g status-right "#[fg=yellow]%H:%M #[fg=cyan]%d-%b-%Y"

# TPM
set -g @plugin 'tmux-plugins/tpm'

# Save & restore sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'


##### KEEP DEFAULT PREFIX (Ctrl+b) #####
# (safe for beginners)

##### PANE MOVEMENT WITH ARROW KEYS #####
bind Left  select-pane -L
bind Right select-pane -R
bind Up    select-pane -U
bind Down  select-pane -D

##### OPTIONAL: ALSO SUPPORT HJKL #####
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### SPLITS (EASY TO REMEMBER) #####
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

##### WINDOW MANAGEMENT #####
bind c new-window
bind , command-prompt -I "#W" "rename-window '%%'"

##### DIRECT WINDOW SWITCHING (NO PREFIX) #####
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

##### WINDOW NAVIGATION #####
bind n next-window
bind p previous-window

##### PANE RESIZE (PREFIX + ARROWS) #####
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up    resize-pane -U 3
bind -r Down  resize-pane -D 3

##### QUALITY OF LIFE #####
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"
run '~/.tmux/plugins/tpm/tpm'
