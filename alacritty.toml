# ===========================
# Window Settings
# ===========================
[window]
opacity = 0.95
decorations = "None"
dynamic_title = true

[window.padding]
x = 8
y = 8

# ===========================
# Font Settings
# ===========================
[font]
size = 13

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

# ===========================
# Cursor Settings
# ===========================
[cursor]
style = "Block"
unfocused_hollow = true

# ===========================
# Colors (Rose Pine — exact palette)
# ===========================
[colors.primary]
background = "#191724"
foreground = "#e0def4"

[colors.cursor]
text = "#191724"
cursor = "#ebbcba"

[colors.selection]
text = "#e0def4"
background = "#403d52"

[colors.normal]
black   = "#26233a"
red     = "#eb6f92"
green   = "#31748f"
yellow  = "#f6c177"
blue    = "#9ccfd8"
magenta = "#c4a7e7"
cyan    = "#ebbcba"
white   = "#e0def4"

[colors.bright]
black   = "#6e6a86"
red     = "#eb6f92"
green   = "#31748f"
yellow  = "#f6c177"
blue    = "#9ccfd8"
magenta = "#c4a7e7"
cyan    = "#ebbcba"
white   = "#e0def4"

# ===========================
# Terminal Environment
# ===========================
[env]
TERM = "xterm-256color"

# ===========================
# Keyboard Overrides
# ===========================
[[keyboard.bindings]]
chars = "\u0017"
key = "W"
mods = "Control"
